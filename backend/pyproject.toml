[project]
name = "facility-operations-api"
version = "0.1.0"
description = "Manager-reviewed facility disruption assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "sendgrid>=6.12,<7",
    "strands-agents[openai]>=1.59.0",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
