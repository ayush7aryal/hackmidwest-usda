# Used by docker-compose.akamai.yml after certbot has issued this certificate.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;
    # Docker readiness checks remain HTTP; authenticated flows redirect to TLS.
    location = /api/health {
        proxy_pass http://$api_backend;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/facility/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facility/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://$api_backend;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
