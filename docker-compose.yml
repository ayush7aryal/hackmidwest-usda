services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/facility.db
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      EVALUATION_INTERVAL_HOURS: ${EVALUATION_INTERVAL_HOURS:-3}
      EVALUATE_ON_STARTUP: ${EVALUATE_ON_STARTUP:-false}
    volumes:
      - facility_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s
    stop_grace_period: 180s
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 6s
      retries: 5
volumes:
  facility_data:
